<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PlateWorth</title>
    <meta
      name="description"
      content="Scan a Saudi license plate to get rough AI-estimated values for the vehicle and the plate in SAR."
    />
    <meta name="theme-color" content="#0a0f0d" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- iOS standalone (Add to Home Screen) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PlateWorth" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Applies saved theme/language before first paint (external file so the CSP needs no 'unsafe-inline'). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>PlateWorth needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
